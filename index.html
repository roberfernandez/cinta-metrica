<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cinta Mètrica">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="./cinta-metrica-192.png">
  <link rel="apple-touch-icon" href="./cinta-metrica-192.png">
  <title>Cinta Mètrica</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <header class="topbar">
    <a class="back" href="https://roberfernandez.github.io/tmb-agent/" aria-label="Tornar a TMB Agent">‹</a>
    <div><h1>Cinta Mètrica</h1><p>Metro de Barcelona</p></div>
    <div class="tmb">TMB</div>
  </header>

  <main>
    <section class="reel" aria-label="Selector de línia">
      <div class="reel-grip left"></div>
      <div class="selector" aria-label="Línia 4">
        <button class="line-arrow" type="button" data-dir="prev" aria-label="Línia anterior">‹</button>
        <strong>L4</strong>
        <button class="line-arrow" type="button" data-dir="next" aria-label="Línia següent">›</button>
      </div>
      <div class="reel-grip right"></div>
    </section>

    <section class="tape-wrap">
      <div class="tape" id="tape">
      </div>
    </section>
  </main>

  <script src="app.js?v=10"></script>
  <script>if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script>
</body>
</html>
