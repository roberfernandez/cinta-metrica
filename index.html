<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101b">
  <title>Cinta Mètrica</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="topbar">
    <a class="back" href="https://roberfernandez.github.io/tmb-agent/" aria-label="Tornar a TMB Agent">‹</a>
    <div><h1>Cinta Mètrica</h1><p>Metro de Barcelona</p></div>
    <div class="tmb">TMB</div>
  </header>

  <main>
    <section class="reel" aria-label="Selector de línia">
      <div class="reel-grip left"></div>
      <button class="selector" type="button" aria-label="Línia 4">
        <span>‹</span><strong>L4</strong><span>›</span>
      </button>
      <div class="reel-grip right"></div>
    </section>

    <section class="tape-wrap">
      <div class="tape" id="tape">
        <div class="direction v2">V.2 ↓</div>
      </div>
    </section>
  </main>

  <script src="app.js?v=4"></script>
</body>
</html>
